name: CI determinística

# Valida versões, migrações, pacote público e fluxos essenciais antes de
# qualquer publicação. Dependências e ações ficam presas a versões imutáveis.

on:
  push:
    branches: [ main, 'codex/**', 'claude/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
      - name: Configurar Node fixado
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm ci
      - name: Instalar navegador do Playwright (Chromium)
        run: npx playwright install --with-deps chromium
      - name: Validar, construir e testar o pacote público
        run: npm run test:ci
      # A SUÍTE CLÍNICA PRECISA RODAR AQUI, E ELA NÃO RODAVA.
      # Em 12/10/2026 o app foi para produção com o login quebrado para TODO
      # MUNDO — ninguém conseguia entrar — e esta CI passou verde. O motivo:
      # `test:ci` cobre segurança, estrutura e fronteiras, mas os testes de
      # COMPORTAMENTO CLÍNICO (pré, ficha, financeiro, impressão, retificação,
      # isolamento entre clínicas, e a própria tela de entrada) vivem em
      # tests/smoke.mjs e ficaram de fora quando a suíte foi reorganizada.
      # "CI verde" passou a significar menos do que parecia, e foi assim que o
      # defeito atravessou. Roda contra dist/ — o pacote que de fato se publica,
      # não a árvore de desenvolvimento.
      - name: Testes clínicos (suíte completa, contra o pacote publicável)
        run: node tests/smoke.mjs --app-root=dist
      - name: Guardar pacote validado
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: soft-anestesia-dist
          path: dist
          if-no-files-found: error
          retention-days: 7
