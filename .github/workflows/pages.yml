name: Publicar no GitHub Pages
run-name: Publicar ${{ inputs.source_sha || 'main' }}${{ inputs.authorization && format(' — {0}', inputs.authorization) || '' }}

# Publica somente o pacote público, e somente por decisão de Marcelo. O commit
# tem de estar em main e ter uma execução push da CI concluída com sucesso.
#
# POR QUE OS CAMPOS DEIXARAM DE SER OBRIGATÓRIOS
# Publicar exigia colar à mão um SHA de 40 caracteres e inventar um código
# "G5-...". Na prática isso não decidia nada — a decisão é apertar o botão —,
# mas custava uma ida ao histórico de commits a cada correção, e um SHA
# desatualizado fazia a execução ser recusada depois de 14 segundos, parecendo
# falha. Agora, em branco, publica o HEAD atual de main.
#
# O QUE NÃO MUDOU, E É O QUE IMPORTA: continua sendo disparo manual, só da
# conta de Marcelo, só a partir de main, e só de um commit cuja CI passou —
# CI que agora inclui os 260 testes clínicos. Quem quiser publicar um commit
# específico (voltar a uma versão anterior, por exemplo) preenche source_sha.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Opcional — SHA completo a publicar. Em branco, publica o topo de main."
        required: false
        type: string
      authorization:
        description: "Opcional — referência da sua autorização, para o registro (formato G5-...)"
        required: false
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mpcaliman' && github.triggering_actor == 'mpcaliman' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      AUTHORIZATION: ${{ inputs.authorization }}
    steps:
      - name: Baixar o commit a publicar
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha || 'main' }}
          fetch-depth: 0
      - name: Confirmar main e CI aprovada
        shell: bash
        run: |
          git fetch --no-tags origin main
          # Em branco significa "publique o que está pronto em main". A conferência
          # seguinte continua valendo para os dois caminhos: o commit TEM de ser o
          # topo de main e TEM de ter CI aprovada.
          if [[ -z "$SOURCE_SHA" ]]; then
            SOURCE_SHA="$(git rev-parse origin/main)"
            echo "Publicando o topo de main: $SOURCE_SHA"
          fi
          # exportado porque o bloco Node e a chamada ao gh abaixo leem do ambiente
          export SOURCE_SHA
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha deve ser um SHA completo em minúsculas" >&2
            exit 1
          fi
          # A referência é registro, não tranca: a decisão é o disparo manual
          # desta execução, pela conta do proprietário. Se vier, tem de ser bem
          # formada; se não vier, a execução fica registrada do mesmo jeito.
          if [[ -n "$AUTHORIZATION" && ! "$AUTHORIZATION" =~ ^G5-[A-Za-z0-9._/-]+$ ]]; then
            echo "authorization, quando informada, segue o formato G5-cartao" >&2
            exit 1
          fi
          test "$(git rev-parse origin/main)" = "$SOURCE_SHA"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { assertMigrationBaselineState, assertPublicationDispatch } from './scripts/migration-baseline-gate.mjs';
          assertPublicationDispatch({ eventName: process.env.GITHUB_EVENT_NAME, ref: process.env.GITHUB_REF,
            actor: process.env.GITHUB_ACTOR, triggeringActor: process.env.GITHUB_TRIGGERING_ACTOR,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT, repository: process.env.GITHUB_REPOSITORY });
          const baseline = JSON.parse(readFileSync('database/migration-baseline.json', 'utf8'));
          assertMigrationBaselineState(baseline, { purpose: 'publication' });
          console.log(JSON.stringify({ owner: process.env.GITHUB_ACTOR, sha: process.env.SOURCE_SHA,
            gate: process.env.AUTHORIZATION, proof: `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}` }));
          JS
          approved_runs="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$SOURCE_SHA" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"
          test "$approved_runs" -gt 0
      - name: Configurar Node fixado
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências pelo lockfile
        run: npm ci
      - name: Gerar e validar o pacote público
        run: npm run build && npm run validate:dist
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # actions/configure-pages@v5
        with:
          enablement: true
      - name: Enviar somente o pacote público
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.actor == 'mpcaliman' && github.triggering_actor == 'mpcaliman' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # actions/deploy-pages@v4
