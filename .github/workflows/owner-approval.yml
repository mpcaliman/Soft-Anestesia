name: Autorização do proprietário

# O verificador e este workflow vêm de main/base, nunca do diff avaliado.
# O status é publicado no HEAD real do PR, inclusive em issue_comment.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

concurrency:
  group: owner-authorization-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  owner-authorization:
    if: (github.event_name != 'issue_comment' || github.event.issue.pull_request) && (github.event_name == 'issue_comment' || github.event.pull_request.base.ref == 'main')
    name: Verificar autorização registrada
    runs-on: ubuntu-latest
    steps:
      - name: Carregar somente o verificador da base confiável
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - name: Verificar decisão e publicar status no SHA avaliado
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          node --input-type=module <<'JS'
          import { verifyGitHubAuthorization } from './scripts/verify-owner-authorization.mjs';
          const repository = process.env.GITHUB_REPOSITORY;
          const pr = process.env.PR_NUMBER;
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' };
          const response = await fetch(`https://api.github.com/repos/${repository}/pulls/${pr}`, { headers });
          if (!response.ok) throw new Error('PR indisponível');
          const pull = await response.json();
          let state = 'pending', description = 'Diff em preparação: aprovação do proprietário pendente', error;
          if (!pull.draft) {
            try {
              console.log(await verifyGitHubAuthorization({repository, pr, sha: pull.head.sha,
                scope: 'merge', reference: `G4-PR-${pr}`, token: process.env.GH_TOKEN}));
              state = 'success'; description = 'Proprietário autorizou este SHA e escopo de merge';
            } catch (e) { state = 'failure'; description = 'Falta autorização válida do proprietário para este SHA'; error = e; }
          }
          const status = await fetch(`https://api.github.com/repos/${repository}/statuses/${pull.head.sha}`, {
            method: 'POST', headers, body: JSON.stringify({state, description,
              context: 'Autorização G4 do proprietário',
              target_url: `https://github.com/${repository}/actions/runs/${process.env.GITHUB_RUN_ID}`})
          });
          if (!status.ok) throw new Error('Não foi possível publicar status no HEAD do PR');
          if (error) throw error;
          JS
